<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Selected engineering projects by Evan Mullins.">
  <link rel="icon" href="../../assets/stars.png" type="image/png">
  <link rel="stylesheet" href="../../assets/site.css">
  <title>Work — Evan Mullins</title>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="../../index.html" aria-label="Evan Mullins home">EM<span>.</span></a>
    <nav aria-label="Primary navigation">
      <a href="../../index.html">Home</a>
      <a class="active" href="projects.html">Work</a>
      <a href="../resume/resume.html">Resume</a>
      <a href="mailto:evangmullins@gmail.com">Contact</a>
    </nav>
  </header>
  <main class="work-page">
    <section class="page-intro">
      <p class="eyebrow">Selected work</p>
      <h1><strong>Things I've Built</strong></h1>
      <p class="intro-copy">A growing collection of design, software, data, and build projects. Each project starts with a practical question and ends with something to learn from.</p>
    </section>
    <section class="timeline-section" aria-label="Career timeline">
      <div class="timeline" id="timeline"></div>
    </section>
    <section class="project-list" id="project-list" aria-label="Engineering projects"></section>
  </main>
  <footer class="site-footer">
    <p>© 2026 Evan Mullins</p>
    <a href="mailto:evangmullins@gmail.com">evangmullins@gmail.com</a>
  </footer>
  <script>
    async function loadTimeline() {
    const track = document.getElementById('timeline');
    try {
      const response = await fetch('projects.json', { cache: 'no-store' });
      const projects = await response.json();

      const matches = (p) => /design team|internship/i.test(p.type || '');
      const timelineProjects = projects
        .filter(matches)
        .sort((a, b) => new Date(a.date) - new Date(b.date)); // oldest → newest, left to right

      track.innerHTML = timelineProjects.map(project => `
        <a class="timeline-item" href="project.html?project=${encodeURIComponent(project.id)}">
          <span class="timeline-date">${project.dateDisplay}</span>
          <span class="timeline-dot" aria-hidden="true"></span>
          <span class="timeline-type">${project.type}</span>
          <h3 class="timeline-title">${project.title}</h3>
        </a>`).join('');
    } catch (error) {
      track.innerHTML = '<p class="empty-state">Timeline could not be loaded.</p>';
    }
  }
    async function loadProjects() {
      const container = document.getElementById('project-list');
      try {
        const response = await fetch('projects.json', { cache: 'no-store' });
        const projects = await response.json();
        
        const isPresent = (p) => /present/i.test(p.dateDisplay || '');
        
        projects.sort((a, b) => {
          const aPresent = isPresent(a);
          const bPresent = isPresent(b);
          if (aPresent && !bPresent) return -1;
          if (!aPresent && bPresent) return 1;
          return new Date(b.date) - new Date(a.date);
        });

        container.innerHTML = projects.map((project, index) => `
          <a class="project-row" href="project.html?project=${encodeURIComponent(project.id)}">
            <span class="project-number">${String(index + 1).padStart(2, '0')}</span>
            <div class="project-thumbnail"><img src="${project.image}" alt="${project.title}"></div>
            <div class="project-summary">
              <p class="project-meta">${project.type} · ${project.dateDisplay}</p>
              <h2>${project.title}</h2>
              <p>${project.description}</p>
            </div>
            <span class="project-arrow" aria-hidden="true">↗</span>
          </a>`).join('');
      } catch (error) {
        container.innerHTML = '<p class="empty-state">Projects could not be loaded. Please try again shortly.</p>';
      }
    }
    loadTimeline();
    loadProjects();
  </script>
</body>
</html>
